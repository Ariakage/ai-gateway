name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Rust and SDK compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build
        run: cargo build --locked
      - name: Install SDK test dependencies
        run: python -m pip install openai anthropic
      - name: Mock upstream smoke and official SDK checks
        shell: bash
        run: |
          set -euo pipefail
          cp dev/test-config.toml "$RUNNER_TEMP/gateway-config.toml"
          python dev/mock_upstream.py 19100 > "$RUNNER_TEMP/mock.log" 2>&1 &
          mock_pid=$!
          target/debug/ai-gateway --config "$RUNNER_TEMP/gateway-config.toml" > "$RUNNER_TEMP/gateway.log" 2>&1 &
          gateway_pid=$!
          trap 'kill "$gateway_pid" "$mock_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          import urllib.request

          for url in (
              "http://127.0.0.1:19100/v1/models",
              "http://127.0.0.1:18787/healthz",
          ):
              for attempt in range(100):
                  try:
                      with urllib.request.urlopen(url, timeout=1):
                          pass
                      break
                  except Exception:
                      time.sleep(0.1)
              else:
                  raise SystemExit(f"Server did not become ready: {url}")
          PY
          python dev/smoke_test.py
          python dev/sdk_test.py
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mock-integration-logs
          path: |
            ${{ runner.temp }}/mock.log
            ${{ runner.temp }}/gateway.log
          if-no-files-found: ignore
          retention-days: 7
